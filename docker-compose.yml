name: deepinterview

# WP-12 full stack.
# docker compose up brings up the base stack: web + agent-api + lightrag.
# The live voice worker is gated behind the `live` profile.

services:

  lightrag:
    build: ./services/lightrag

    ports:
      - "127.0.0.1:9621:9621"

    env_file:
      - path: .env
        required: false

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9621/health').status==200 else 1)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped


  agent-api:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
      target: api

    command:
      - uv
      - run
      - uvicorn
      - deepinterview_agent.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      - LIGHTRAG_URL=http://lightrag:9621

    env_file:
      - path: .env
        required: false

    depends_on:
      lightrag:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped

    # Allow the agent container to reach Ollama
    # running natively on the Linux host.
    extra_hosts:
      - "host.docker.internal:host-gateway"


  # Live voice worker.
  agent-worker:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
      target: worker

    profiles:
      - live

    command:
      - uv
      - run
      - python
      - -m
      - deepinterview_agent.worker
      - start

    environment:
      - AGENT_API_URL=http://agent-api:8000
      - LIGHTRAG_URL=http://lightrag:9621

    env_file:
      - path: .env
        required: false

    depends_on:
      agent-api:
        condition: service_started
      lightrag:
        condition: service_healthy

    restart: unless-stopped


  # ── Optional local model servers ─────────────────────────────────────────
  #
  # NOT used for our current setup.
  #
  # We are running Ollama natively on the host:
  #
  #   Ollama → qwen3:1.7b
  #
  # These services are kept behind the `local` profile so they won't start
  # unless explicitly requested.

  ollama:
    image: ollama/ollama:latest

    profiles:
      - local

    ports:
      - "127.0.0.1:11434:11434"

    environment:
      - OLLAMA_CONTEXT_LENGTH=16384

    volumes:
      - ollama-models:/root/.ollama

    restart: unless-stopped


  ollama-pull:
    image: ollama/ollama:latest

    profiles:
      - local

    depends_on:
      - ollama

    environment:
      - OLLAMA_HOST=http://ollama:11434

    entrypoint:
      - /bin/sh
      - -c
      - ollama pull ${OLLAMA_MODEL:-qwen3:8b}

    restart: "no"


  # Optional local STT server.
  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cpu

    profiles:
      - local

    ports:
      - "127.0.0.1:8001:8000"

    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface

    restart: unless-stopped


  # Optional local TTS server.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest

    profiles:
      - local

    ports:
      - "127.0.0.1:8880:8880"

    restart: unless-stopped


  # Web application.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}

    ports:
      - "3000:3000"

    environment:
      - AGENT_API_URL=http://agent-api:8000
      - LIGHTRAG_URL=http://lightrag:9621

    env_file:
      - path: .env
        required: false

    depends_on:
      agent-api:
        condition: service_started
      lightrag:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped


volumes:
  ollama-models:
  whisper-models: